<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Crunch Dashboard</title>

  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="cereal-container" id="cerealBox"></div>
  
  <div class="header">
    <span class="mascot" id="mascot" title="Crunchy Cookie">🍪</span>
    <h2>Cookie Crunch</h2>
  </div>
  
  <span class="not-stamp">NOT!</span>
  <div class="hostname" id="hostname">—</div>
  
  <button class="wl-btn" id="wlBtn">Disable on this site</button>
  
  <!-- Aggressive Mode Switch -->
  <div class="glass-card">
    <div class="crunch-mode-row">
      <span>AGGRESSIVE CRUNCH</span>
      <label class="switch">
        <input type="checkbox" id="aggressiveToggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="total-bar">
    <span>TOTAL BLOCKED</span>
    <span class="big" id="totalCount">0</span>
  </div>
  
  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-num" id="popupCount">0</div>
      <div class="stat-label">Popups</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="adCount">0</div>
      <div class="stat-label">Ads</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="tabCount">0</div>
      <div class="stat-label">Tabs</div>
    </div>
  </div>

  <div class="glass-card">
    <div class="log-section">
      <div class="log-title">Recent Activity</div>
      <div class="log-list" id="logList">
        <div class="log-empty">No blocks yet on this page</div>
      </div>
    </div>
  </div>

  <!-- Custom Blocklist Input -->
  <div class="glass-card" style="padding: 10px; margin-bottom: 8px;">
    <div class="custom-block-row">
      <input type="text" id="customDomain" class="custom-input" placeholder="block domain.com">
      <button id="addCustomBtn" class="add-btn">ADD</button>
      <span class="wl-feedback" id="blockFeedback"></span>
    </div>
  </div>

  <!-- Whitelist Domain Input -->
  <div class="glass-card" style="padding: 10px; margin-bottom: 12px;">
    <div class="custom-block-row">
      <input type="text" id="whitelistInput" class="custom-input" placeholder="whitelist domain.com">
      <button id="addWhitelistBtn" class="add-btn" style="background:#4CAF50;">ADD</button>
      <span class="wl-feedback" id="wlFeedback"></span>
    </div>
  </div>

  <!-- Manage Filters Section -->
  <div class="manage-section">
    <button id="manageBtn" class="manage-btn">⚙️ MANAGE FILTERS</button>
    <div id="managePanel" class="manage-panel" style="display: none;">
      <div class="manage-list-title">CUSTOM BLOCKED DOMAINS</div>
      <div id="customBlockList" class="manage-list-container">
        <div class="manage-empty">No custom blocks yet</div>
      </div>
      <div class="manage-list-title" style="margin-top: 10px;">WHITELISTED DOMAINS</div>
      <div id="whiteListContainer" class="manage-list-container">
        <div class="manage-empty">No whitelisted sites yet</div>
      </div>
    </div>
  </div>

  <div class="lifetime">
    <div class="lt-title">All Time Stats</div>
    <div class="lt-num" id="ltTotal">0</div>
    <div class="lt-row"><span>Popups:</span><span id="ltPop">0</span></div>
    <div class="lt-row"><span>Ads:</span><span id="ltAd">0</span></div>
    <div class="lt-row"><span>Tabs killed:</span><span id="ltTab">0</span></div>
  </div>

  <button id="masterSwitch" class="toggle-btn">CRUNCHING</button>
  
  <script src="popup.js"></script>
</body>
</html>
