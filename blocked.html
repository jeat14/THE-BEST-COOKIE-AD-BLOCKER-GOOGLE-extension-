    <script>
        // Failsafe absolute asset resolution & iframe breakout
        (function() {
            try {
                // Absolute URL resolution
                const base = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
                if (base && base.startsWith('chrome-extension://')) {
                    document.addEventListener('DOMContentLoaded', () => {
                        document.querySelectorAll('img').forEach(img => {
                            const src = img.getAttribute('src');
                            if (src && src.startsWith('./assets/')) {
                                img.src = base + src.slice(2);
                            }
                        });
                    });
                }

                // Iframe breakout
                if (window.self !== window.top) {
                    // Try direct breakout first
                    try {
                        window.top.location.href = window.location.href;
                    } catch (err) {
                        // Same-Origin policy fallback: ask background to update parent tab
                        if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
                            chrome.runtime.sendMessage({ action: 'breakoutOfIframe' });
                        }
                    }
                }
            } catch(e) {}
        })();
    </script>
    <style>

<body>
    <section class="home-section">

        <div class="container">

            <button class="btn-close" id="closeBtn">Close this Tab</button>

    <script>
        // Close immediately on close trigger click
        function closeNow() {
            chrome.runtime.sendMessage({ action: 'closeBlockedTab' });
            window.close();
        }

        document.getElementById('closeBtn').onclick = closeNow;
